# MIDIgen configuration. Relative paths resolve against the MIDIgen folder.

[paths]
# Every .sf2 in these folders is catalogued (symlinks to the same file count once).
# The AI-TV web UI's SoundFonts page uploads into the first one; you can also copy files there
# over SFTP. Only SoundFonts you chose go here: no system or downloaded defaults.
soundfont_dirs = ["/home/mint/ai_tv/library/soundfonts"]
# Generated catalogue, measured descriptors and the preset audition cache.
catalog = "catalog"
# Your own listening notes about presets, merged into the catalogue (see config/notes.toml).
notes = "config/notes.toml"

[tools]
fluidsynth = "fluidsynth"

[render]
sample_rate = 44100
# Final WAV sample format: 16 or 24 bit.
bits = 16
# The finished mix is scaled so its loudest sample sits here.
peak_dbfs = -1.0
# Reverb and release tails rendered after the last bar, then trimmed once silent.
tail_seconds = 3.0
# Stems (one per SoundFont + channel) render in parallel.
jobs = 2
# Keep the per-track stems next to the mix (useful for ducking under dialogue later).
keep_stems = false

# FluidSynth settings for every render, passed as -o name=value. Check names with `fluidsynth`
# shell command "settings" (FluidSynth 2.3.1 on this machine).
[render.fluidsynth]
"synth.gain" = 0.5
"synth.polyphony" = 256
"synth.midi-bank-select" = "gs"
"synth.reverb.active" = 1
"synth.chorus.active" = 1

# Room presets a composition picks with "mix": {"reverb": "<name>"}. Per-track send = CC91.
[reverb]
dry = { "synth.reverb.active" = 0 }
room = { "synth.reverb.room-size" = 0.35, "synth.reverb.damp" = 0.4, "synth.reverb.width" = 0.6, "synth.reverb.level" = 0.6 }
plate = { "synth.reverb.room-size" = 0.55, "synth.reverb.damp" = 0.2, "synth.reverb.width" = 0.9, "synth.reverb.level" = 0.7 }
hall = { "synth.reverb.room-size" = 0.75, "synth.reverb.damp" = 0.3, "synth.reverb.width" = 1.0, "synth.reverb.level" = 0.8 }
cathedral = { "synth.reverb.room-size" = 0.95, "synth.reverb.damp" = 0.15, "synth.reverb.width" = 1.0, "synth.reverb.level" = 0.9 }

# Per-SoundFont overrides, keyed by catalogue id (the lower-cased file name without .sf2).
# "fluidsynth" settings here win over [render.fluidsynth] and the room preset, so a font that
# is mastered hot or has heavy built-in effects can be tamed without touching the others.
# "description" is shown to the composing LLM.
# Example, once a font called SC55.sf2 has been uploaded:
# [soundfonts.sc55]
# description = "Roland SC-55 style GS set: punchy, dry, very early-90s."
# fluidsynth = { "synth.gain" = 0.4, "synth.chorus.level" = 1.0 }
